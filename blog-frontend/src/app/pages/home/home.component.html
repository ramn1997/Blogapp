<div class="page-wrapper">
    <!-- Archive Feed / Search Results -->
    <main class="archives-container container">
        <div class="loading-state" *ngIf="loading">
            <div class="editorial-spinner"></div>
        </div>

        <div class="search-results-header" *ngIf="searchQuery && !loading" style="margin-bottom: 30px;">
            <h1 class="serif" style="font-size: 2.5rem;">Results for "{{ searchQuery }}"</h1>
        </div>

        <div class="editorial-grid" *ngIf="!loading">
            <div *ngFor="let blog of blogs; let i = index" [class.featured-item]="i === 0 && !searchQuery">
                <app-blog-card [blog]="blog" [featured]="i === 0 && !searchQuery"></app-blog-card>
            </div>
        </div>

        <!-- Empty State -->
        <div class="empty-state" *ngIf="!loading && blogs.length === 0" style="padding: 100px 0; text-align: center;">
            <span class="material-icons" style="font-size: 4rem; color: #eee; margin-bottom: 20px;">search_off</span>
            <h3 class="serif">No entries found.</h3>
            <p class="text-muted">The archives are silent on this topic.</p>
        </div>

        <!-- Pagination -->
        <nav class="archives-pagination" *ngIf="!loading && totalPages > 1" style="margin-top: 60px;">
            <button (click)="loadBlogs(currentPage - 1)" [disabled]="currentPage === 1">
                <span class="material-icons">chevron_left</span>
            </button>
            <span class="page-info">{{ currentPage }} / {{ totalPages }}</span>
            <button (click)="loadBlogs(currentPage + 1)" [disabled]="currentPage === totalPages">
                <span class="material-icons">chevron_right</span>
            </button>
        </nav>
    </main>

    <!-- Site Footer -->
    <footer class="site-footer container" style="margin-top: 100px; padding: 40px 0; border-top: 1px solid #eee;">
        <div class="footer-right">
            <span class="copyright">© 2026 Scribeflow. All rights reserved.</span>
        </div>
    </footer>
</div>
