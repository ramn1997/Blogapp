<div class="auth-page-wrapper">

    <!-- Sign In Card -->
    <main class="auth-card">
        <h2 class="card-title">Welcome Back</h2>
        <p class="card-subtitle">Enter your credentials to access your account.</p>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
            <div class="alert alert-error" *ngIf="error">{{ error }}</div>

            <div class="form-group">
                <div class="label-row">
                    <label class="form-label">EMAIL ADDRESS</label>
                </div>
                <div class="form-input-wrap">
                    <input type="email" formControlName="email" class="form-input" placeholder="name@example.com"
                        autocomplete="email">
                    <div class="field-error"
                        *ngIf="f['email'].touched && (f['email'].errors?.['required'] || f['email'].errors?.['email'])">
                        Enter a valid email
                    </div>
                </div>
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label class="form-label">PASSWORD</label>
                    <button type="button" class="forgot-link">FORGOT PASSWORD?</button>
                </div>
                <div class="form-input-wrap">
                    <input [type]="showPassword ? 'text' : 'password'" formControlName="password" class="form-input"
                        placeholder="••••••••" autocomplete="current-password">
                    <button type="button" class="toggle-pwd" (click)="showPassword = !showPassword">
                        {{ showPassword ? '🙈' : '👁' }}
                    </button>
                    <div class="field-error" *ngIf="f['password'].touched && f['password'].errors?.['required']">
                        Password is required
                    </div>
                </div>
            </div>

            <button class="btn-signin" type="submit" [disabled]="loading">
                <span class="spinner" *ngIf="loading"></span>
                {{ loading ? 'SIGNING IN...' : 'SIGN IN' }}
            </button>
        </form>

        <div class="social-divider">
            <span>OR CONTINUE WITH</span>
        </div>

        <div class="social-grid">
            <button type="button" class="social-btn" (click)="triggerGoogleLogin()" [disabled]="loading">
                <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" alt="G" class="social-icon">
                GOOGLE
            </button>
            <button type="button" class="social-btn" (click)="triggerMicrosoftLogin()" [disabled]="loading">
                <span class="microsoft-mark" aria-hidden="true">
                    <span></span><span></span><span></span><span></span>
                </span>
                MICROSOFT
            </button>
        </div>

        <footer class="card-footer">
            <span>New to the gallery? </span>
            <a routerLink="/auth/register">Create an account</a>
        </footer>
    </main>

    <!-- Page Footer -->
    <footer class="page-footer">
        © 2026 SCRIBEFLOW. RESERVED EXCELLENCE.
    </footer>

    <!-- Hidden element for Google SDK rendering if needed -->
    <div id="google-btn-hidden" style="display: none;"></div>
</div>
