<div class="auth-page-wrapper">


    <!-- Sign Up Card -->
    <main class="auth-card">
        <h2 class="card-title">Join Us</h2>
        <p class="card-subtitle">Begin your journey into deep-form journalism and refined storytelling.</p>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
            <div class="alert alert-error" *ngIf="error">{{ error }}</div>

            <div class="form-group">
                <label class="form-label">FULL NAME</label>
                <input type="text" formControlName="fullName" class="form-input" placeholder="Arthur Rimbaud"
                    autocomplete="name">
                <div class="field-error" *ngIf="f['fullName'].touched && f['fullName'].errors?.['required']">Full name
                    is required</div>
            </div>

            <div class="form-group">
                <label class="form-label">EMAIL ADDRESS</label>
                <input type="email" formControlName="email" class="form-input" placeholder="muse@editorial.com"
                    autocomplete="email">
                <div class="field-error"
                    *ngIf="f['email'].touched && (f['email'].errors?.['required'] || f['email'].errors?.['email'])">
                    Enter a valid email
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">PASSWORD</label>
                <div class="form-input-wrap">
                    <input [type]="showPassword ? 'text' : 'password'" formControlName="password" class="form-input"
                        placeholder="••••••••" autocomplete="new-password">
                    <button type="button" class="toggle-pwd" (click)="showPassword = !showPassword"
                        style="position: absolute; right: 0; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer;">
                        {{ showPassword ? '🙈' : '👁' }}
                    </button>
                    <div class="field-error"
                        *ngIf="f['password'].touched && (f['password'].errors?.['required'] || f['password'].errors?.['minlength'])">
                        At least 6 characters
                    </div>
                </div>
            </div>

            <button class="btn-signin" type="submit" [disabled]="loading">
                <span class="spinner" *ngIf="loading"></span>
                {{ loading ? 'CREATING...' : 'CREATE ACCOUNT' }}
            </button>

            <!-- Hidden field to keep form structure consistent -->
            <input type="hidden" formControlName="preferredEmail">
        </form>

        <div class="social-divider">
            <span>OR CONTINUE WITH</span>
        </div>

        <div class="social-grid single-social">
            <button type="button" class="social-btn" (click)="triggerGoogleLogin()">
                <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" alt="G" class="social-icon">
                GOOGLE
            </button>
        </div>

        <footer class="card-footer">
            <span>Already a member? </span>
            <a routerLink="/auth/login">Sign In</a>
        </footer>
    </main>

    <!-- Page Footer -->
    <footer class="page-footer">
        © 2026 SCRIBEFLOW. RESERVED EXCELLENCE.
    </footer>

</div>
