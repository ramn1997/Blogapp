<div class="editorial-write" *ngIf="form">
    <header class="write-header">
        <div class="write-actions">
            <button type="button" class="editorial-btn-ghost" (click)="onCancel()" [disabled]="loading">Cancel</button>
        </div>
        <div class="write-actions-right">
            <button type="button" class="editorial-btn-outline" (click)="saveAsDraft()" [disabled]="loading" *ngIf="!form.get('isPublished')?.value">Save Draft</button>
            <button type="button" class="editorial-btn-dark" (click)="onSubmit()" [disabled]="loading">
                {{ loading ? 'Saving...' : (isEdit ? 'Update' : 'Publish') }}
            </button>
        </div>
    </header>

    <form [formGroup]="form">
        <!-- Minimalist Hero Cover Upload -->
        <div class="cover-hero" 
             (click)="coverInput.click()" 
             [class.has-image]="form.get('coverImageUrl')?.value" 
             (dragover)="onDragOver($event)" 
             (drop)="onDropCover($event)">
            
            <input type="file" #coverInput style="display: none" (change)="onCoverSelected($event)" accept="image/*">
            <img *ngIf="form.get('coverImageUrl')?.value" [src]="form.get('coverImageUrl')?.value | imageUrl" class="cover-image-actual">
            
            <div class="cover-overlay" *ngIf="form.get('coverImageUrl')?.value">
                 <span class="material-icons">edit</span> Change Cover
            </div>
            
            <div class="cover-placeholder-hero" *ngIf="!form.get('coverImageUrl')?.value">
                <span class="material-icons" style="font-size: 2.5rem; margin-bottom: 12px; color: #ccc;">add_photo_alternate</span>
                <span class="placeholder-main">Add a cover image</span>
                <span class="placeholder-sub">Click to browse, drag & drop, or paste an image anywhere outside the text</span>
            </div>
        </div>

        <!-- Zen Editor Section -->
        <div class="zen-editor">
            <input type="text" 
                   formControlName="title" 
                   class="zen-title-input" 
                   placeholder="Title"
                   (input)="onTitleChange()">

            <div class="zen-content-editable" 
                 contenteditable="true" 
                 #contentEditor
                 (input)="onContentChange($event)"
                 (paste)="onContentPaste($event)"
                 data-placeholder="Tell your story... You can paste images directly here."></div>
        </div>

        <!-- Configuration Section -->
        <div class="config-section">
            <div class="config-header">
                <h3>Story Settings</h3>
                <div class="editor-meta-bar">
                    <span>{{ wordCount }} words</span>
                    <span class="meta-dot">&middot;</span>
                    <span>{{ readTime }} min read</span>
                </div>
            </div>

            <div class="config-grid">
                <div class="field-group">
                    <label class="field-label">Category</label>
                    <select formControlName="category" class="editorial-select">
                        <option value="" disabled selected hidden>Select Category</option>
                        <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
                    </select>
                </div>
                <div class="field-group">
                    <label class="field-label">Tags (Comma separated)</label>
                    <input type="text" formControlName="tags" class="field-input" placeholder="e.g. design, writing, art">
                </div>
            </div>

            <div class="field-group">
                <label class="field-label">Short Summary</label>
                <textarea formControlName="summary" class="editorial-textarea" placeholder="A brief description for listings..."></textarea>
            </div>

            <div class="field-group publish-group">
                <label class="publish-toggle">
                    <input type="checkbox" formControlName="isPublished" class="toggle-input">
                    <div class="toggle-switch"></div>
                    <span class="toggle-label-text">{{ form.get('isPublished')?.value ? 'Publish visibly on profile' : 'Keep as draft' }}</span>
                </label>
            </div>
        </div>
    </form>
</div>
