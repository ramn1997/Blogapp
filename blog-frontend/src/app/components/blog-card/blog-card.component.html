<article class="editorial-card" [class.featured]="featured">
    <!-- Image -->
    <a [routerLink]="['/blog', blog.id]" class="card-image-wrap">
        <img *ngIf="blog.coverImageUrl" [src]="blog.coverImageUrl" [alt]="blog.title" class="card-image">
        <div *ngIf="!blog.coverImageUrl" class="card-image-placeholder">
            <span class="material-icons" style="font-size: 2.5rem; opacity: 0.3;">auto_stories</span>
        </div>
        <div class="card-badge" *ngIf="blog.category">{{ blog.category | uppercase }}</div>
    </a>

    <div class="card-content">
        <!-- Date / Metadata -->
        <div class="card-meta">
            <span class="meta-item">{{ blog.createdAt | date:'MMM dd, yyyy' | uppercase }}</span>

        </div>

        <!-- Title -->
        <a [routerLink]="['/blog', blog.id]" class="card-title-wrap">
            <h3 class="card-title">{{ blog.title }}</h3>
        </a>

        <!-- Summary (optional for grid, shown for featured) -->
        <p class="card-excerpt" *ngIf="blog.summary">{{ blog.summary }}</p>

        <!-- Tags -->
        <div class="card-tags" *ngIf="getTags().length > 0">
            <a [routerLink]="['/']" [queryParams]="{ q: tag }" class="card-tag" *ngFor="let tag of getTags()" (click)="$event.stopPropagation()">#{{ tag | lowercase }}</a>
        </div>

        <!-- Footer -->
        <div class="card-footer">
            <div class="author-layout">
                <a class="author-avatar-wrap" [routerLink]="['/profile']" [queryParams]="{userId: blog.author.id}" (click)="$event.stopPropagation()">
                    <div class="avatar-stack">
                        <span class="material-icons author-fallback-icon">account_circle</span>
                        <img *ngIf="blog.author.avatarUrl" [src]="blog.author.avatarUrl" [alt]="blog.author.fullName" 
                            class="author-mini-photo" loading="eager">
                    </div>
                </a>
                <div class="author-info">
                    <span class="by">BY</span>
                    <a class="author-name" [routerLink]="['/profile']" [queryParams]="{userId: blog.author.id}" (click)="$event.stopPropagation()">{{ blog.author.fullName | uppercase }}</a>
                </div>
            </div>

            <div class="card-stats">
                <span class="material-icons"
                    style="font-size: 1.1rem; color: #ff4757; vertical-align: middle; cursor: default;">favorite</span>
                <span class="stat-count">{{ blog.likeCount }}</span>
                <span class="divider"></span>
                <span class="material-icons"
                    style="font-size: 1rem; color: #888; vertical-align: middle; cursor: default;">chat_bubble_outline</span>
                <span class="stat-count">{{ blog.commentCount }}</span>
                <span class="divider"></span>
                <button class="save-btn" (click)="toggleSave($event)" [title]="blog.isSavedByCurrentUser ? 'Remove from Saved' : 'Save to Collection'">
                    <span class="material-icons" [style.color]="blog.isSavedByCurrentUser ? '#d4af37' : 'inherit'">{{ blog.isSavedByCurrentUser ? 'bookmark' : 'bookmark_border' }}</span>
                </button>
            </div>
        </div>

        <!-- Dashboard Actions -->
        <div class="card-actions" *ngIf="showActions">
            <button class="action-link edit" (click)="$event.stopPropagation(); onEdit.emit(blog.id)">
                <span class="material-icons"
                    style="font-size: 1.1rem; vertical-align: middle; margin-right: 4px;">edit</span>
                EDIT
            </button>
            <button class="action-link delete" (click)="$event.stopPropagation(); onDelete.emit(blog.id)">
                <span class="material-icons"
                    style="font-size: 1.1rem; vertical-align: middle; margin-right: 4px;">delete</span>
                DELETE
            </button>
        </div>
    </div>
</article>
