<nav class="editorial-nav">
    <div class="nav-container">
        <!-- Brand -->
        <a routerLink="/" class="nav-brand">
            <span>Scribeflow</span>
        </a>

        <!-- Search Bar -->
        <div class="nav-search-wrap">
            <div class="search-box-mini">
                <input type="text" [(ngModel)]="searchQuery" (keyup.enter)="onSearch()"
                    placeholder="Search archives...">
                <button (click)="onSearch()">
                    <span class="material-icons">search</span>
                </button>
            </div>
        </div>

        <!-- Desktop nav links -->
        <div class="nav-links">
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}"
                class="nav-link">Explore</a>
        </div>

        <!-- Right actions -->
        <div class="nav-actions">
            <ng-container *ngIf="!currentUser; else loggedIn">
                <a routerLink="/auth/login" class="btn btn-ghost btn-sm">Sign in</a>
                <a routerLink="/auth/register" class="btn btn-primary btn-sm">Join</a>
            </ng-container>

            <ng-template #loggedIn>
                <div class="user-menu-wrapper" *ngIf="currentUser">
                    <button class="avatar-btn" (click)="toggleUserMenu()">
                        <img *ngIf="currentUser?.avatarUrl" [src]="currentUser!.avatarUrl" [alt]="currentUser!.fullName"
                            class="avatar">
                        <span *ngIf="!currentUser?.avatarUrl" class="avatar avatar-fallback">
                            {{ getInitials(currentUser!.fullName) }}
                        </span>
                    </button>
                    <div class="user-dropdown" *ngIf="userMenuOpen && currentUser">
                        <div class="dropdown-header">
                            <div class="dropdown-name">{{ currentUser.fullName }}</div>
                        </div>
                        <div class="dropdown-divider"></div>
                        <a routerLink="/dashboard" class="dropdown-item" (click)="closeMenus()">
                            <span class="material-icons" style="font-size: 1.2rem;">article</span>
                            My Blogs
                        </a>
                        <a routerLink="/profile" class="dropdown-item" (click)="closeMenus()">
                            <span class="material-icons" style="font-size: 1.2rem;">person</span>
                            Profile
                        </a>
                        <div class="dropdown-divider"></div>
                        <button class="dropdown-item danger" (click)="logout()">
                            <span class="material-icons" style="font-size: 1.2rem;">logout</span>
                            Sign out
                        </button>
                    </div>
                </div>
                <a routerLink="/write" class="nav-btn-black">
                    <span class="material-icons"
                        style="font-size: 1.1rem; vertical-align: middle; margin-right: 6px;">edit</span>
                    Write Post
                </a>
            </ng-template>


        </div>
    </div>
</nav>
