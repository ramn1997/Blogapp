<!doctype html>
<html lang="en">

<head>
  <!-- MSAL Popup Handler -->
  <script>
    if (window.opener && window.opener !== window && (window.location.hash || window.location.search)) {
      document.documentElement.style.display = 'none';
      setTimeout(() => { if (window.opener && !window.opener.closed) window.close(); }, 5000);
    }
  </script>
  <meta charset="utf-8">
  <base href="/">
  <title>Scribeflow | Write, Discover, Connect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Scribeflow is a modern editorial blog platform where your voice finds its audience. Explore deep stories, expert insights, and creative writing.">
  
  <!-- Open Graph -->
  <meta property="og:title" content="Scribeflow | A Modern Editorial Experience">
  <meta property="og:description" content="Discover, write, and share insightful stories. Scribeflow brings you the best in tech, lifestyle, and culture.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://scribeflow-blog.web.app">
  <meta property="og:image" content="https://scribeflow-blog.web.app/assets/og-image.jpg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>
  <app-root></app-root>
</body>

</html>
